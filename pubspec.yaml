name: rang_bazaar
description: RangBazaar — a premium Indian e-commerce Flutter app powered by Fake Store API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo_square.png
    - assets/promo/

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: launcher_icon
  adaptive_icon_background: "#F5EFE8"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
